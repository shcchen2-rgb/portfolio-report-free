# ============================================================
# 系統設定【個人版】
# AI 引擎：Anthropic API（需要 ANTHROPIC_API_KEY）
# ============================================================

report:
  title: "每日投資組合分析報告"
  # 漲跌顏色慣例：tw = 紅漲綠跌（台灣習慣）, us = 綠漲紅跌（美國習慣）
  color_convention: us

ai:
  # claude-haiku-4-5：最便宜，12 檔持股一天約 14 次呼叫，一個月不到 US$2
  #
  # 想要更好的分析品質可改成 claude-sonnet-5（約貴一倍）。
  # ⚠️ 注意：Sonnet 5 與 Opus 5 不接受 temperature 參數，換過去要把下面
  #    temperature 那一行刪掉，否則 API 會回 400 錯誤。
  model: claude-haiku-4-5

  # 溫度：越低越保守，減少 AI 腦補（沒有網路查證能力，建議偏低）
  temperature: 0.4

  # 每次 AI 呼叫之間隔幾秒。Anthropic 的速率限制比之前寬鬆，
  # 但留一點間隔可避免撞到每分鐘上限
  seconds_between_calls: 2

  # 花費上限：一次執行最多呼叫幾次 AI，超過就用佔位文字降級。
  # 這是帳單的安全閥——持股檔數暴增時不會無限制地花錢。
  # 12 檔持股約用 14 次，設 60 有充裕餘裕。
  max_total_ai_calls: 60

email:
  subject_prefix: "📊 每日投資組合分析"
