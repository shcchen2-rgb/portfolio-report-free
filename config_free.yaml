# ============================================================
# 系統設定【免費版】
# AI 引擎：GitHub Models（零成本，Actions 自動提供 GITHUB_TOKEN）
# ============================================================

report:
  title: "每日投資組合分析報告（免費版）"
  # 漲跌顏色慣例：tw = 紅漲綠跌（台灣習慣）, us = 綠漲紅跌（美國習慣）
  color_convention: us

ai:
  # 預設 openai/gpt-4o-mini：免費額度最寬（約 150 次/天），
  # 你前一個財經摘要專案用的也是它，確定能跑
  #
  # 想試更強的模型可改成 openai/gpt-4.1（分析品質較好，
  # 但高階模型免費額度降到約 50 次/天——10 檔持股約用 12 次，仍夠用）
  # 注意：GitHub Models 的模型目錄會變動，若執行時出現
  # unknown model 之類的錯誤，改回 openai/gpt-4o-mini 即可
  model: openai/gpt-4o-mini

  # 溫度：越低越保守，減少 AI 腦補（免費版沒有網路查證，建議偏低）
  temperature: 0.4

  # 每次 AI 呼叫之間隔幾秒（免費額度有每分鐘次數限制，別調太低）
  seconds_between_calls: 5

email:
  subject_prefix: "📊 每日投資組合分析（免費版）"
