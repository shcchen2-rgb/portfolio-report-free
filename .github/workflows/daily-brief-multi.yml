name: Daily Stock Brief (Multi-user)

# 排程已改由外部觸發器（cron-job.org）於洛杉磯 16:10 準點呼叫 GitHub API 觸發，
# 不再使用 GitHub 內建的 schedule（內建 schedule 會排隊延遲數十分鐘到數小時）。
# cron-job.org 可設定時區為 America/Los_Angeles，日光節約自動處理，不需要兩組 cron。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "執行模式（auto=正式，休市不寄；test=測試，休市也強制跑）"
        type: choice
        required: false
        default: auto
        options:
          - auto
          - test
      dry_run:
        description: "只產生 PDF 不寄信（驗證版面用，不會打擾訂閱者）"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝系統套件（PDF 引擎 + 中文字型）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b fonts-noto-cjk

      - name: 安裝 Python 套件
        run: pip install -r requirements_free.txt

      - name: 產生並寄送訂閱報告
        env:
          # test 模式＝休市日也強制執行（分析最近一個交易日），auto 模式休市會自動跳過
          FORCE: ${{ (inputs.mode || 'auto') == 'test' && '1' || '' }}
          # dry_run＝跑完整流程（含 AI 與 PDF）但不寄任何信
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Google 表單回應試算表的 CSV 網址（沒設就改讀 subscribers.yaml）
          SUBSCRIBERS_CSV_URL: ${{ secrets.SUBSCRIBERS_CSV_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python daily_brief_multi.py

      - name: 備份全部 PDF（保留 30 天；dry_run 時也用來檢查版面）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefs-${{ github.run_id }}
          path: output/*.pdf
          retention-days: 30
          if-no-files-found: ignore
