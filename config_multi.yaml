# ============================================================
# 系統設定【多人訂閱版】
# ============================================================

ai:
  # claude-haiku-4-5：最便宜。1 位訂閱者約 26 次呼叫/天（不到 US$2/月），
  #   30 位訂閱者約 180 次（約 US$13/月）
  #
  # 想要更好的引用紀律與具體度可改成 claude-sonnet-5（約貴一倍）。
  # ⚠️ 注意：Sonnet 5 與 Opus 5 不接受 temperature 參數，換過去要把下面
  #    temperature 那一行刪掉，否則 API 會回 400 錯誤。
  model: claude-haiku-4-5

  # 溫度調低，減少 AI 自由發揮與腦補
  temperature: 0.25

  # Anthropic 的速率限制比之前寬鬆，間隔可以縮短，整體執行時間會明顯下降
  seconds_between_calls: 2

  # 全域 AI 呼叫預算（花費上限）：超過就用佔位文字降級。
  # 這是帳單的安全閥——訂閱人數暴增時不會無限制地花錢。
  # 對照：1 人約 26 次、30 人約 180 次。設 200 可撐滿 max_subscribers。
  max_total_ai_calls: 200

  # 每位訂閱者的「綜合觀察」段落（每人每語言多 1 次 AI 呼叫）
  #
  # ⚠️ 這是唯一「隨訂閱人數線性成長」的成本項目：個股分析全員共用（會飽和），
  #    但 synthesis 是每人一次。訂閱破百時這裡會佔總呼叫數的三分之一，
  #    要壓成本就先關這個。
  include_synthesis: true

news:
  # 新聞抓取期間（天）——只採用這段期間內的消息，程式會硬性過濾日期
  days: 3
  # 每檔股票列出幾則佐證新聞（AI 只能引用這幾則，編號與報告一致）
  items_per_stock: 5

subscribers:
  # 退訂名單：有人回信說不想收了，把 email 加在這裡（表單資料不用動）
  blocklist:
    # - someone@example.com

  # 安全閥：一天最多寄給幾人，避免表單被大量填寫時爆掉 AI 帳單
  max_subscribers: 30

email:
  sender_name: "Daily Stock Brief"
